name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build app
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee build.log
      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true

      - name: Render snapshots
        run: |
          mkdir -p snapshots
          ./build/Lagoon.app/Contents/MacOS/Lagoon --snapshots "$PWD/snapshots"
          ls -la snapshots

      - name: Package app
        run: |
          cd build
          ditto -c -k --keepParent Lagoon.app Lagoon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lagoon-app
          path: build/Lagoon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
